# Példa forgatókönyv — `npx set-demo examples/pelda.yaml`
#
# ⚠ EZ NEM FUT LE ÖNMAGÁBAN: a selectorok egy képzeletbeli alkalmazásra mutatnak. A fájl
# a MEZŐKET mutatja be — másold, és írd át a saját felületedre.
#
# A forgatókönyv EGYBEN VÉGIGPRÓBA. Minden lépéshez tartozhat `elvaras` — az teszi a
# felvételt bizonyítékká. Elvárás nélküli lépés megengedett, de az semmit nem igazol.

cim: "Feladat létrehozása"
alcim: "Új funkció"
verzio: "v1.4.0"
bevezeto: >-
  A feladatok mostantól listából nyílnak, és a határidő a létrehozáskor megadható —
  nem kell utólag szerkeszteni.

# `nezet: mobil` → 390×844, érintés-emuláció, kurzor nélkül (a telefonon nincs egérmutató).
nezet: { width: 1280, height: 800 }

# A vágás a viewport koordinátáiban értendő; a motor átszámolja a renderelt felbontásra.
# Csak a GIF-re hat — itt a bal oldali ikonsávot vágja le.
vago: { x: 64, y: 0, w: 1216, h: 800 }

tempo:
  uresjarat: 2.5   # a hálózati várakozás gyorsítása
  cselekves: 1.0   # a kattintás és a görgetés normál tempóban marad
  levego: 900      # minden kiemelés UTÁN ennyi ideig tiszta, sötétítetlen a kép

# ELŐKÉSZÍTÉS (opcionális) — a demó ELŐÁLLÍTJA, amit mutatni fog. Külön böngésző-kontextus,
# asztali viewport, felirat és reflektor nélkül; nem kerül a felvételre. A bukása ABORTÁL.
elokeszites:
  - cimke: "Projekt létrehozása, hogy legyen mibe felvenni"
    megnyit: /projektek/uj
    kitolt: { mezo: "[data-testid='input-project-name']", ertek: "Bemutató projekt" }
    kattint: "[data-testid='btn-save']"
    elvaras: "text=Projekt létrehozva"

lepesek:
  - cimke: "A feladatlista megnyitása"
    megnyit: /feladatok
    magyarazat: "A lista minden nyitott feladatot mutat, szűrés nélkül."
    elvaras: "[data-testid='task-list']"

  # Kritérium szerinti választás listából. Enélkül a demó „az első sort" mutatja, tehát
  # MINDEN FUTÁS MÁST — és a magyarázat elcsúszhat a képtől.
  - cimke: "Egy nyitott feladat kiválasztása"
    valaszt:
      lista: "[data-testid^='task-row-']"
      tartalmaz: ["Nyitott"]
      kizar: ["Archivált"]
      benne: "button[data-testid^='btn-open-']"   # a kritérium a SORON, a kattintás a gombon
    elvaras: "[data-testid='task-detail']"

  - cimke: "Határidő megadása"
    # `{{ma}}` / `{{ma+3}}` / `{{ma-1}}` — a futás napjára old fel. Beégetett dátummal a
    # forgatókönyv másnap NÉMÁN elromlik: a felvétel elkészül, csak nem mutat semmit.
    kitolt: { mezo: "[data-testid='input-due-date']", ertek: "{{ma+3}}" }
    magyarazat: "A határidő a létrehozáskor megadható — nem kell utólag szerkeszteni."

  - cimke: "Mentés"
    buborek: "Innen menti — a lista azonnal frissül."   # a kattintás ELŐTT, a cél elemnél
    buborekIdo: 1900
    kattint: "[data-testid='btn-save-task']"
    fokusz:                                             # a kattintás UTÁN, az eredményen
      hol: "[data-testid='task-list']"
      szoveg: "A feladat a listában, határidővel."
      ido: 1800
    elvaras: "text=Mentve"

  - cimke: "A lista átnézése"
    gorget: { hol: "[data-testid='task-list']", mennyi: 400 }
    varakozas: 2000

# A lapba alapból VIDEÓ kerül. GIF csak kérésre — levél TÖRZSÉBE ágyazva az animált GIF az
# egyetlen, ami magától elindul:
#
# gif: { fps: 1.6, kockahossz: 0.9, szelesseg: 900 }
# lap: { mozgokep: gif }
